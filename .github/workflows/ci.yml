# On every push and pull request: run the tests, then check the image still builds.
# Needs no secrets: it uses the fictional sanctions list and the public law store.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finguard
          POSTGRES_USER: finguard_owner
          POSTGRES_PASSWORD: ci-only-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finguard_owner -d finguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://finguard_owner:ci-only-owner-password@127.0.0.1:5432/finguard
      APP_DB_PASSWORD: ci-only-app-password
      TEST_OWNER_DATABASE_URL: postgresql+psycopg://finguard_owner:ci-only-owner-password@127.0.0.1:5432/finguard
      TEST_APP_DATABASE_URL: postgresql+psycopg://finguard_app:ci-only-app-password@127.0.0.1:5432/finguard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Create the tables
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest test -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t finguard:ci .

