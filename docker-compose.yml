# Starts the database and both doors:  docker compose up -d --build
# The door ports open only on this computer, because the REST door has no login yet (Step 7C).
# The database has no outside port at all: only the other containers can reach it.

x-finguard: &finguard
  build: .
  image: finguard:local
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  env_file:
    - path: .env
      required: false
  volumes:
    # Files that are never in the image. Whole folders, so a fresh clone without them still starts.
    - ./data/sanctions:/app/data/sanctions:ro
    - ./data/law_store:/app/data/law_store:ro
    # Models are downloaded once and kept. Audit logs survive a restart.
    - models:/home/finguard/.cache/huggingface
    - logs:/app/logs

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard_owner -d finguard"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    build: .
    image: finguard:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://finguard_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/finguard
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *finguard
    environment:
      AUDIT_LOG_PATH: logs/audit-api.jsonl
      POSTGRES_PASSWORD: ""
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://finguard_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/finguard
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?Set VAULT_MASTER_KEY in .env}
      FINGUARD_API_KEY: ${FINGUARD_API_KEY:?Set FINGUARD_API_KEY in .env}
      ANALYST_KEY_PRIMARY: ${ANALYST_KEY_PRIMARY:?Set ANALYST_KEY_PRIMARY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  mcp:
    <<: *finguard
    command: ["python", "-m", "src.mcp_server.server"]
    environment:
      AUDIT_LOG_PATH: logs/audit-mcp.jsonl
      POSTGRES_PASSWORD: ""
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://finguard_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/finguard
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?Set VAULT_MASTER_KEY in .env}
      FINGUARD_API_KEY: ""
      ANALYST_KEY_PRIMARY: ""
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  models:
  logs:
  pgdata:
